services:
  supertokens:
    hostname: supertokens
    image: registry.supertokens.io/supertokens/supertokens-mysql:10.1.4

    environment:
      MYSQL_HOST: ${DB_HOST:?set DB_HOST}
      MYSQL_PORT: 3306
      MYSQL_DATABASE_NAME: supertokens
      MYSQL_USER: ${SUPERTOKENS_DB_USER:?set SUPERTOKENS_DB_USER}
      MYSQL_PASSWORD: ${SUPERTOKENS_DB_PASS:?set SUPERTOKENS_DB_PASS}

    networks:
      - game_node_app
      - gamenode
    restart: always

    deploy:
      replicas: 1

    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis server for caching; disposable, so no persistence.
  redis:
    image: redis:8.10.3-alpine3.23
    hostname: server-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'

    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

    deploy:
      replicas: 1

    networks:
      - game_node_app

  # Redis server exclusive to BullMQ
  redis_bullmq:
    image: redis:8.10.3-alpine3.23
    hostname: server-redis-bullmq
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1024mb", "--maxmemory-policy", "noeviction"]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    volumes:
      - redis_bullmq:/data

    networks:
      - game_node_app

  manticore:
    image: manticoresearch/manticore:29.9.0
    hostname: manticore
    environment:
      TZ: UTC
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DATABASE: gamenode
      CREATE_PLAIN_TABLES: "games:0 3 * * *;users:0 * * * *;games;users"
    entrypoint: ["/bin/bash", "/etc/manticoresearch/entrypoint.sh"]
    command: ["searchd", "--nodetach"]
    restart: always
    deploy:
      replicas: 1
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticore:/var/lib/manticore
      - ./docker/manticore/manticore.conf.template:/etc/manticoresearch/manticore.conf.template:ro
      - ./docker/manticore/entrypoint.sh:/etc/manticoresearch/entrypoint.sh:ro
      - ./docker/manticore/reindex.sh:/etc/manticoresearch/reindex.sh:ro
    networks:
      - game_node_app
      - gamenode

  cms-media-init:
    image: directus/directus:12.6.0
    user: root
    entrypoint: ['sh', '-c', 'chown 1000:1000 /media']
    restart: "no"
    volumes:
      - blog-cms-public:/media
  cms:
    image: directus/directus:12.6.0
    environment:
      SECRET: ${CMS_SECRET:?set CMS_SECRET}
      LICENSE_KEY: ${CMS_LICENSE_KEY:?set CMS_LICENSE_KEY}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD}
      DB_CLIENT: mysql
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: blog_cms
      DB_USER: blog_cms
      DB_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      PUBLIC_URL: ${BLOG_CMS_PUBLIC_URL:?set BLOG_CMS_PUBLIC_URL}
      BLOG_REFERENCE_API_URL: http://server:5000/v1
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN:?set BLOG_CMS_PREVIEW_TOKEN}
      STORAGE_LOCATIONS: private
      STORAGE_PRIVATE_DRIVER: local
      STORAGE_PRIVATE_ROOT: /directus/uploads
      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MAX_UPLOAD_CONCURRENCY: 1
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: 4096
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: 4096
      ASSETS_TRANSFORM_MAX_OPERATIONS: 5
      ASSETS_TRANSFORM_MAX_CONCURRENT: 1
      ASSETS_TRANSFORM_TIMEOUT: 15s
      REVISIONS_RETENTION: 30d
    volumes:
      - blog-cms-private:/directus/uploads
      - blog-cms-public:/directus/public-media
      - ./docker/cms/extensions:/directus/extensions:ro
      - ./src/blog/blog-post/blog-media.cjs:/directus/blog-media.cjs:ro
    networks:
      game_node_app:
        aliases: [blog-cms]
      gamenode: {}
    depends_on:
      cms-media-init:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8055/server/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  server:
    depends_on:
      cms-media-init:
        condition: service_completed_successfully
      server_migration:
        condition: service_completed_successfully
    image: lamarcke/game-node-server:1.9.2
    hostname: server

    # Only variables listed here reach the container; Coolify uses its env values for interpolation.
    environment:
      NODE_ENV: production
      REDIS_URL: redis://server-redis:6379
      BULLMQ_REDIS_URL: redis://server-redis-bullmq:6379
      SUPERTOKENS_CORE_URI: http://supertokens:3567
      MANTICORE_URL: http://manticore:9308
      SERVER_PORT: 5000
      DOMAIN_API: https://server.gamenode.app
      DOMAIN_WEBSITE: https://gamenode.app
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_DATABASE: gamenode
      DB_PASS: ${DB_PASS}
      DB_USER: ${DB_USER}
      DB_PORT: 3306
      PROVIDER_GOOGLE_CLIENT_ID: ${PROVIDER_GOOGLE_CLIENT_ID}
      PROVIDER_GOOGLE_CLIENT_SECRET: ${PROVIDER_GOOGLE_CLIENT_SECRET}
      PROVIDER_DISCORD_CLIENT_ID: ${PROVIDER_DISCORD_CLIENT_ID}
      PROVIDER_DISCORD_CLIENT_SECRET: ${PROVIDER_DISCORD_CLIENT_SECRET}
      PROVIDER_TWITTER_CLIENT_ID: ${PROVIDER_TWITTER_CLIENT_ID}
      PROVIDER_TWITTER_CLIENT_SECRET: ${PROVIDER_TWITTER_CLIENT_SECRET}
      XBOX_API_USER: ${XBOX_API_USER}
      XBOX_API_PASS: ${XBOX_API_PASS}
      STEAM_API_KEY: ${STEAM_API_KEY}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      PSN_NPSSO_KEY: ${PSN_NPSSO_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BLOG_CMS_URL: http://blog-cms:8055
      BLOG_CMS_PUBLIC_URL: ${BLOG_CMS_PUBLIC_URL}
      BLOG_CMS_DELIVERY_TOKEN: ${BLOG_CMS_DELIVERY_TOKEN}
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN}
      BLOG_PUBLIC_MEDIA_PATH: /app/blog-public-media
      CONNECTION_CREDENTIAL_ENCRYPTION_KEY: ${CONNECTION_CREDENTIAL_ENCRYPTION_KEY:?set CONNECTION_CREDENTIAL_ENCRYPTION_KEY}
      # Starts paused for the initial validation; set true in Coolify after the smoke tests.
      PLAYER_DATA_SYNC_ENABLED: ${PLAYER_DATA_SYNC_ENABLED:-false}


    healthcheck:
      test: [ "CMD-SHELL", "yarn run healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3

    restart: always

    deploy:
      replicas: 1

    command: "yarn start:prod"

    volumes:
      - blog-cms-public:/app/blog-public-media:ro

    networks:
      - game_node_app
      - gamenode

  # Runs pending migrations once per deploy; the server only starts after it exits successfully.
  # Its image tag may differ from the server's.
  server_migration:
    image: lamarcke/game-node-server:1.9.2
    hostname: server-migration
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_DATABASE: gamenode
      DB_PASS: ${DB_PASS}
      DB_USER: ${DB_USER}
      DB_PORT: 3306

    # Coolify leaves restart "no" services out of the application status, so the exited container is not "degraded".
    restart: "no"
    command: "yarn migration:run"

    networks:
      - game_node_app
      - gamenode



networks:
  game_node_app:
    external: true
  # Dedicated Coolify destination network, shared with the managed MySQL and isolated from Coolify's own containers.
  gamenode:
    external: true

volumes:
  redis_bullmq:
  manticore:
  blog-cms-private:
  blog-cms-public:
    name: gamenode-blog-public-media
