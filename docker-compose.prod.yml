# Stateful / shared infrastructure for GameNode production (Redis, Manticore, Directus CMS, autoheal).
# API replicas (gamenode-api-1, gamenode-api-2), worker (gamenode-worker), and migrations (gamenode-migration)
# are separate Coolify resources so routine code deploys roll with zero downtime without touching infra.
services:
  # Redis server for caching; disposable, so no persistence.
  redis:
    image: redis:8.10.3-alpine3.23
    hostname: server-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    restart: always
    cpus: 0.5
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    deploy:
      replicas: 1
    networks:
      game_node_app: {}
      gamenode:
        aliases: [server-redis]

  # Redis server exclusive to BullMQ
  redis_bullmq:
    image: redis:8.10.3-alpine3.23
    hostname: server-redis-bullmq
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1024mb", "--maxmemory-policy", "noeviction"]
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    restart: always
    cpus: 0.5
    mem_limit: 1280m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - redis_bullmq:/data
    networks:
      game_node_app: {}
      gamenode:
        aliases: [server-redis-bullmq]

  manticore:
    # Config template, entrypoint and reindex script are baked into the image (docker/manticore/Dockerfile);
    # Coolify freezes bind-mounted repo files after the first deploy, which left prod on a stale template.
    image: lamarcke/game-node-manticore:${MANTICORE_IMAGE_TAG:?set MANTICORE_IMAGE_TAG}
    hostname: manticore
    environment:
      TZ: UTC
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DATABASE: gamenode
      CREATE_PLAIN_TABLES: "games:0 3 * * *;users:0 * * * *;games;users"
    restart: always
    cpus: 1
    mem_limit: 1g
    deploy:
      replicas: 1
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticore:/var/lib/manticore
    networks:
      - game_node_app
      - gamenode

  cms-media-init:
    image: directus/directus:12.6.0
    user: root
    entrypoint: ['sh', '-c', 'chown 1000:1000 /media']
    restart: "no"
    volumes:
      - blog-cms-public:/media

  cms:
    image: directus/directus:12.6.0
    environment:
      SECRET: ${CMS_SECRET:?set CMS_SECRET}
      LICENSE_KEY: ${CMS_LICENSE_KEY:?set CMS_LICENSE_KEY}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD}
      DB_CLIENT: mysql
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: blog_cms
      DB_USER: blog_cms
      DB_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      PUBLIC_URL: ${BLOG_CMS_PUBLIC_URL:?set BLOG_CMS_PUBLIC_URL}
      BLOG_REFERENCE_API_URL: http://server:5000/v1
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN:?set BLOG_CMS_PREVIEW_TOKEN}
      STORAGE_LOCATIONS: private
      # Assets live in R2 under cms/ of the shared uploads bucket; /directus/uploads stays local for blog-media staging.
      STORAGE_PRIVATE_DRIVER: s3
      STORAGE_PRIVATE_BUCKET: gamenode-user-uploads
      STORAGE_PRIVATE_ROOT: cms
      STORAGE_PRIVATE_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      STORAGE_PRIVATE_REGION: auto
      STORAGE_PRIVATE_FORCE_PATH_STYLE: "true"
      STORAGE_PRIVATE_KEY: ${CMS_S3_ACCESS_KEY_ID:?set CMS_S3_ACCESS_KEY_ID}
      STORAGE_PRIVATE_SECRET: ${CMS_S3_SECRET_ACCESS_KEY:?set CMS_S3_SECRET_ACCESS_KEY}
      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MAX_UPLOAD_CONCURRENCY: 1
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: 4096
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: 4096
      ASSETS_TRANSFORM_MAX_OPERATIONS: 5
      ASSETS_TRANSFORM_MAX_CONCURRENT: 1
      ASSETS_TRANSFORM_TIMEOUT: 15s
      REVISIONS_RETENTION: 30d
    volumes:
      - blog-cms-private:/directus/uploads
      - blog-cms-public:/directus/public-media
      - ./docker/cms/extensions:/directus/extensions:ro
      - ./src/blog/blog-post/blog-media.cjs:/directus/blog-media.cjs:ro
    networks:
      game_node_app:
        aliases: [blog-cms]
      gamenode:
        aliases: [blog-cms]
    depends_on:
      cms-media-init:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8055/server/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # Docker alone never restarts an unhealthy container; this restarts the services labelled autoheal=true.
  # The socket mount gives it control of the host's Docker, so it is pinned and scoped by label.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

networks:
  game_node_app:
    external: true
  # Dedicated Coolify destination network, shared with the managed MySQL and isolated from Coolify's own containers.
  gamenode:
    external: true

volumes:
  redis_bullmq:
  manticore:
  blog-cms-private:
  blog-cms-public:
    name: gamenode-blog-public-media
