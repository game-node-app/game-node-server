services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: gamenode
      MYSQL_PASSWORD: gamenode
      MYSQL_DATABASE: gamenode

    ports:
      - "3306:3306"

    restart: no
    volumes:
      - db:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10


  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-mysql:10.1.4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"

    environment:
      MYSQL_CONNECTION_URI: mysql://gamenode:gamenode@db:3306/gamenode

    restart: no

    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3-alpine3.23
    ports:
      - "6379:6379"
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'

    restart: no

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

    volumes:
      - redis:/data

  minio:
    # shortcut: legacy MinIO is for local S3 fixtures only, replace it before hosted use.
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    environment:
      - MINIO_ROOT_USER=gamenode
      - MINIO_ROOT_PASSWORD=gamenode
      - MINIO_DEFAULT_BUCKETS=gamenode-user-uploads

  manticore:
    image: manticoresearch/manticore:29.9.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gamenode
      DB_PASS: gamenode
      DB_DATABASE: gamenode
      CREATE_PLAIN_TABLES: "games:0 3 * * *;users:0 * * * *;games;users"
    entrypoint: ["/bin/bash", "/etc/manticoresearch/entrypoint.sh"]
    command: ["searchd", "--nodetach"]
    restart: no
    ports:
      - "127.0.0.1:9306:9306"
      - "127.0.0.1:9308:9308"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticore:/var/lib/manticore
      - ./docker/manticore/manticore.conf.template:/etc/manticoresearch/manticore.conf.template:ro
      - ./docker/manticore/entrypoint.sh:/etc/manticoresearch/entrypoint.sh:ro
      - ./docker/manticore/reindex.sh:/etc/manticoresearch/reindex.sh:ro

  cms-media-init:
    image: directus/directus:12.6.0
    user: root
    entrypoint: ['sh', '-c', 'chown 1000:1000 /media']
    volumes:
      - cms-published-media:/media

  cms:
    image: directus/directus:12.6.0
    ports:
      - '127.0.0.1:8055:8055'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SECRET: ${CMS_SECRET:?set CMS_SECRET in .env}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD in .env}
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN:-}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/cms.sqlite
      PUBLIC_URL: ${BLOG_CMS_PUBLIC_URL:-http://localhost:8055}
      BLOG_REFERENCE_API_URL: ${BLOG_REFERENCE_API_URL:-http://host.docker.internal:5000/v1}
      STORAGE_LOCATIONS: private
      STORAGE_PRIVATE_DRIVER: local
      STORAGE_PRIVATE_ROOT: /directus/uploads
      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MAX_UPLOAD_CONCURRENCY: 1
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: 4096
      ASSETS_TRANSFORM_MAX_CONCURRENT: 1
    volumes:
      - cms-database:/directus/database
      - cms-assets:/directus/uploads
      - cms-published-media:/directus/public-media
      - ./docker/cms/extensions:/directus/extensions:ro
      - ./src/blog/blog-post/blog-media.cjs:/directus/blog-media.cjs:ro
    cpus: 1
    mem_limit: 1g
    depends_on:
      cms-media-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8055/server/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  cms-load-media-init:
    profiles: [cms-load]
    image: directus/directus:12.6.0
    user: root
    entrypoint: ['sh', '-c', 'chown 1000:1000 /media']
    volumes:
      - cms-load-published-assets:/media

  cms-load-mysql:
    profiles: [cms-load]
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: cms-local-load-root
      MYSQL_DATABASE: cms_load_test
      MYSQL_USER: cms_load_test
      MYSQL_PASSWORD: cms-local-load-only
    volumes:
      - cms-load-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 2s
      timeout: 5s
      retries: 60

  cms-load:
    profiles: [cms-load]
    container_name: gamenode-cms-load-cms-1
    image: directus/directus:12.6.0
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      SECRET: ${CMS_SECRET:?set CMS_SECRET in .env}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD in .env}
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN:-}
      BLOG_REFERENCE_API_URL: ${BLOG_REFERENCE_API_URL:-http://host.docker.internal:5000/v1}
      DB_CLIENT: mysql
      DB_HOST: cms-load-mysql
      DB_PORT: 3306
      DB_DATABASE: cms_load_test
      DB_USER: cms_load_test
      DB_PASSWORD: cms-local-load-only
      PUBLIC_URL: http://localhost:8056
      STORAGE_LOCATIONS: private
      STORAGE_PRIVATE_DRIVER: local
      STORAGE_PRIVATE_ROOT: /directus/uploads
      FILES_MAX_UPLOAD_SIZE: 10mb
    depends_on:
      cms-load-mysql:
        condition: service_healthy
      cms-load-media-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8056:8055'
    cpus: 1
    mem_limit: 1g
    volumes:
      - cms-load-assets:/directus/uploads
      - cms-load-published-assets:/directus/public-media
      - ./docker/cms/extensions:/directus/extensions:ro
      - ./src/blog/blog-post/blog-media.cjs:/directus/blog-media.cjs:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8055/server/ping']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

volumes:
  redis:
  db:
  manticore:
  minio:
  cms-database:
    name: gamenode-cms-trial_database
  cms-assets:
    name: gamenode-cms-trial_assets
  cms-published-media:
    name: gamenode-cms-trial_published-assets
  cms-load-mysql:
  cms-load-assets:
  cms-load-published-assets:
