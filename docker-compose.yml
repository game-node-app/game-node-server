version: '3'


services:
  db:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: gamenode
      MYSQL_PASSWORD: gamenode
      MYSQL_DATABASE: gamenode

    ports:
      - "3306:3306"

    restart: no
    volumes:
      - db:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10


  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-mysql:10.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"

    environment:
      MYSQL_CONNECTION_URI: mysql://gamenode:gamenode@db:3306/gamenode

    restart: no

    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'

    restart: no

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

    volumes:
      - redis:/data

  minio:
    image: docker.io/bitnamilegacy/minio:2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    environment:
      - MINIO_ROOT_USER=gamenode
      - MINIO_ROOT_PASSWORD=gamenode
      - MINIO_DEFAULT_BUCKETS=gamenode-user-uploads

  manticore:
    image: manticoresearch/manticore:7.4.6
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gamenode
      DB_PASS: gamenode
      DB_DATABASE: gamenode
      CREATE_PLAIN_TABLES: "games:0 3 * * *;users:0 * * * *;games;users"
    entrypoint: ["/bin/bash", "/etc/manticoresearch/entrypoint.sh"]
    command: ["searchd", "--nodetach"]
    restart: no
    ports:
      - "127.0.0.1:9306:9306"
      - "127.0.0.1:9308:9308"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticore:/var/lib/manticore
      - ./docker/manticore/manticore.conf.template:/etc/manticoresearch/manticore.conf.template:ro
      - ./docker/manticore/entrypoint.sh:/etc/manticoresearch/entrypoint.sh:ro
      - ./docker/manticore/reindex.sh:/etc/manticoresearch/reindex.sh:ro


volumes:
  redis:
  db:
  manticore:
  minio:
