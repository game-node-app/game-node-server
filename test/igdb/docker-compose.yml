name: igdb-sync-test

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: igdb-test-root
      MYSQL_DATABASE: igdb_sync_test
      MYSQL_USER: igdb_test
      MYSQL_PASSWORD: igdb-test-password
    ports:
      - "127.0.0.1:${IGDB_TEST_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${IGDB_TEST_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql-test-data:
  redis-test-data:
