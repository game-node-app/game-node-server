name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: "Also redeploy the shared infra Compose stack (Redis, Manticore, CMS, autoheal)"
        type: boolean
        default: false

# One production deploy at a time; queued runs wait instead of cancelling a deploy mid-flight.
concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: lamarcke/game-node-server
  MANTICORE_IMAGE: lamarcke/game-node-manticore
  COOLIFY_INFRA_UUID: lwi5aeyjnmuc0yzrqpq8c78n
  COOLIFY_MIGRATION_UUID: vubu76okzxkrrqjvfb6flz03
  COOLIFY_API_1_UUID: pohwgb0ebnbry84vhl3eywdc
  COOLIFY_API_2_UUID: nwsf2l3sgmezaux4p85rpiz3
  COOLIFY_WORKER_UUID: ksrejsintsrdwl8oc9o56fwn

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache in the GitHub Actions cache: unchanged pnpm-lock.yaml skips the install layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manticore:
    name: Build Manticore image (only if docker/manticore changed)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      infra_changed: ${{ steps.infra.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: infra
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_infra }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            base_sha="${{ github.event.before }}"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              base_sha="HEAD~1"
            fi
            if git diff --name-only "$base_sha" HEAD 2>/dev/null | grep -Eq '^(docker-compose\.prod\.yml|docker/manticore/|docker/cms/|src/blog/blog-post/blog-media\.cjs)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Content-addressed tag: identical files always map to the same, already published image.
      - id: tag
        run: echo "tag=$(echo '${{ hashFiles('docker/manticore/**') }}' | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: exists
        run: |
          if docker buildx imagetools inspect "$MANTICORE_IMAGE:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.published != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/manticore
          push: true
          tags: ${{ env.MANTICORE_IMAGE }}:${{ steps.tag.outputs.tag }}

  # Runs the image that was just pushed through `pnpm migration:run` on an empty MySQL,
  # so a broken migration step fails here before anything touches production.
  migrations:
    name: Check migrations on an empty database
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: gamenode
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_DATABASE=gamenode \
            -e DB_USER=root -e DB_PASS=ci \
            "$IMAGE:${{ github.sha }}" pnpm migration:run

  deploy:
    name: Rolling deploy to Coolify
    needs: [build, manticore, migrations]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run migrations and rolling deploy API replicas + worker
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
          base="${{ secrets.COOLIFY_URL }}/api/v1"

          set_env() {
            local uuid="$1" key="$2" value="$3"
            curl -fsS -X PATCH "$base/applications/$uuid/envs" \
              -H "$auth" -H "Content-Type: application/json" \
              -d "{\"key\":\"$key\",\"value\":\"$value\",\"is_literal\":true}" >/dev/null
          }

          wait_deploy() {
            local label="$1" uuid="$2" force="${3:-false}"
            echo "::group::Deploy $label ($uuid)"
            local url="$base/deploy?uuid=$uuid"
            [ "$force" = "true" ] && url="$url&force=true"
            local deployment
            deployment=$(curl -fsS -X POST "$url" -H "$auth" | jq -r '.deployments[0].deployment_uuid')
            echo "Coolify deployment: $deployment"
            for _ in $(seq 120); do
              local status
              status=$(curl -fsS "$base/deployments/$deployment" -H "$auth" | jq -r .status)
              echo "$label status: $status"
              case "$status" in
                finished)
                  echo "::endgroup::"
                  return 0
                  ;;
                failed|cancelled*)
                  echo "::endgroup::"
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "Timed out waiting for $label"
            echo "::endgroup::"
            return 1
          }

          deploy_image_app() {
            local label="$1" uuid="$2" tag="$3"
            curl -fsS -X PATCH "$base/applications/$uuid" \
              -H "$auth" -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\":\"$tag\"}" >/dev/null
            wait_deploy "$label" "$uuid"
          }

          # 1. Database migrations — must succeed before any API replica updates.
          set_env "$COOLIFY_MIGRATION_UUID" SERVER_IMAGE_TAG "${{ github.sha }}"
          wait_deploy "migrations" "$COOLIFY_MIGRATION_UUID" "true"

          # 2. Rolling API deploy — one replica at a time so Traefik always keeps a healthy upstream.
          deploy_image_app "api-1" "$COOLIFY_API_1_UUID" "${{ github.sha }}"
          deploy_image_app "api-2" "$COOLIFY_API_2_UUID" "${{ github.sha }}"

          # 3. Infra stack (Redis, Manticore, CMS, autoheal) — only when infra files changed.
          if [ "${{ needs.manticore.outputs.infra_changed }}" = "true" ]; then
            set_env "$COOLIFY_INFRA_UUID" MANTICORE_IMAGE_TAG "${{ needs.manticore.outputs.tag }}"
            wait_deploy "infra" "$COOLIFY_INFRA_UUID"
          fi

          # 4. Background worker (crons, BullMQ, ffmpeg).
          deploy_image_app "worker" "$COOLIFY_WORKER_UUID" "${{ github.sha }}"
