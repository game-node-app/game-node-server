# Unit and integration tests run as separate jobs, so unit feedback does not wait for services.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm test:typecheck
    - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    # The profile video suites skip themselves without ffmpeg.
    - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - run: pnpm test:services:up
    - run: pnpm test:integration
