name: gamenode-blog-cms
services:
  media-init:
    image: directus/directus:12.6.0
    user: root
    entrypoint: ['sh', '-c', 'chown 1000:1000 /media']
    volumes:
      - public-media:/media
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CMS_DB_ROOT_PASSWORD:?set CMS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: blog_cms
      MYSQL_USER: blog_cms
      MYSQL_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    networks: [cms-private]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  cms:
    image: directus/directus:12.6.0
    environment:
      SECRET: ${CMS_SECRET:?set CMS_SECRET}
      LICENSE_KEY: ${CMS_LICENSE_KEY:?set CMS_LICENSE_KEY}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:?set CMS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:?set CMS_ADMIN_PASSWORD}
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: blog_cms
      DB_USER: blog_cms
      DB_PASSWORD: ${CMS_DB_PASSWORD:?set CMS_DB_PASSWORD}
      PUBLIC_URL: ${BLOG_CMS_PUBLIC_URL:?set BLOG_CMS_PUBLIC_URL}
      BLOG_REFERENCE_API_URL: http://server:5000/v1
      BLOG_CMS_PREVIEW_TOKEN: ${BLOG_CMS_PREVIEW_TOKEN:?set BLOG_CMS_PREVIEW_TOKEN}
      STORAGE_LOCATIONS: private
      STORAGE_PRIVATE_DRIVER: local
      STORAGE_PRIVATE_ROOT: /directus/uploads
      FILES_MAX_UPLOAD_SIZE: 10mb
      FILES_MAX_UPLOAD_CONCURRENCY: 1
      FILES_MIME_TYPE_ALLOW_LIST: image/jpeg,image/png,image/webp
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: 4096
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: 4096
      ASSETS_TRANSFORM_MAX_OPERATIONS: 5
      ASSETS_TRANSFORM_MAX_CONCURRENT: 1
      ASSETS_TRANSFORM_TIMEOUT: 15s
      REVISIONS_RETENTION: 30d
    ports:
      - '127.0.0.1:${BLOG_CMS_PORT:-8055}:8055'
    volumes:
      - private-assets:/directus/uploads
      - public-media:/directus/public-media
      - ./extensions:/directus/extensions:ro
      - ../../src/blog/blog-post/blog-media.cjs:/directus/blog-media.cjs:ro
    networks:
      cms-private:
      game_node_app:
        aliases: [blog-cms]
    depends_on:
      mysql:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8055/server/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
networks:
  cms-private:
    internal: true
  game_node_app:
    external: true
volumes:
  database:
  private-assets:
  public-media:
    name: gamenode-blog-public-media
